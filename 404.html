<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page moved</title>
  <script>
    const path = location.pathname.replace(/^\/blog(?=\/|$)/, "") || "/";
    location.replace("https://eodus.github.io" + path + location.search + location.hash);
  </script>
</head>
<body><p>The blog moved to <a href="https://eodus.github.io/">eodus.github.io</a>.</p></body>
</html>
