{% extends "base.html" %}
{% block title %}{{ term.name }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ term.name }}</h1>
{% for page in term.pages %}
<article>
  <h2><a href="{{ page.permalink }}">{{ page.title }}</a></h2>
  <span class="post-date">{{ page.date }}</span>
  {% if page.description %}<p>{{ page.description }}</p>{% endif %}
</article>
{% endfor %}
{% endblock %}
